[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openassay"
version = "0.1.0"
description = "Immunoassay and ligand-binding-assay workflow package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Priyam Thakar", email = "priyamthakar1@gmail.com" }
]
dependencies = [
    "openfit>=0.1.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
reports = [
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
openassay = "openassay.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openassay"]

[tool.ruff]
line-length = 100
target-version = "py310"
# A local openfit checkout may be nested here for development; never lint it as
# part of openassay (it is a separate project) and never let it skew import
# classification.
extend-exclude = ["openfit", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
# openfit is a third-party dependency, not first-party, even when a sibling
# checkout is present in the tree.
known-third-party = ["openfit"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src", "openfit/src"]
exclude = ["openfit/", "\\.venv/"]

[[tool.mypy.overrides]]
# These libraries ship no type stubs in this environment.
module = ["scipy", "scipy.*", "pandas"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# openfit is the external fitting engine. A nested checkout may be present for
# API inspection, but openassay's strict mypy gate should not type-check openfit.
module = ["openfit", "openfit.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src", "openfit/src"]
