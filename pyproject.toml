[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openassay"
version = "0.1.0"
description = "Immunoassay and ligand-binding-assay workflow package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Priyam Thakar", email = "priyamthakar1@gmail.com" }
]
dependencies = [
    "openfit>=0.1.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
reports = [
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
openassay = "openassay.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openassay"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
